          {id:'a5',tag:'Skífurit',q:'Hvenær er hentugt að nota skífurit?',o:['Þegar sýna á þróun margra mælinga yfir langt tímabil.','Þegar sýna á samband tveggja samfelldra breyta.','Þegar tiltölulega fáir flokkar skipta einni heild og óskað er eftir fljótlegu yfirliti.','Þegar samanlögð hlutföll flokkanna eru meiri en 100%.'],c:2,ok:'Skífurit hentar þegar tiltölulega fáir flokkar skipta einni heild og markmiðið er skýrt, fljótlegt yfirlit.',h:['Skoðaðu hve margar stærðir bókin segir að sé hentugt að sýna.','Skífurit á að gefa fljótlegt yfirlit yfir skiptingu einnar heildar.','Veldu svarið þar sem flokkarnir eru tiltölulega fáir og mynda saman eina heild.']},
          {id:'a6',tag:'Skífurit',q:'Hversu stórt miðhorn í gráðum samsvarar 1% af heildinni í skífuriti?',o:['1°','3,6°','36°','100°'],c:1,ok:'Heill hringur er 360°, þannig að 1% samsvarar 360° ÷ 100 = 3,6°.',h:['Heill hringur er 360° og táknar 100%.','Deildu gráðufjölda hringsins með 100.','Reiknaðu 360 ÷ 100.']},
          {id:'a7',tag:'Skífurit',q:'Hvernig breytum við prósentutölu í gráður þegar við búum til skífurit?',o:['Við deilum prósentutölunni með 3,6.','Við margföldum prósentutöluna með 3,6.','Við drögum prósentutöluna frá 360.','Við margföldum prósentutöluna með 100.'],c:1,ok:'Þar sem 1% samsvarar 3,6° fæst miðhornið með því að margfalda prósentutöluna með 3,6.',h:['Notaðu niðurstöðuna um hve margar gráður 1% er.','Hver prósenta leggur 3,6° til hornsins.','Margfaldaðu fjölda prósenta með 3,6° fyrir hvert prósent.']},
          {id:'a8',tag:'Tímalínurit',q:'Hvað er tímalínurit og hvað sýnir það?',o:['Skífurit sem sýnir hlutfall hvers árs af heild.','Línurit sem sýnir hvernig breyta hegðar sér eða þróast með tilliti til tíma.','Súlurit sem ber saman óskylda flokka á einum tímapunkti.','Hnitakerfi sem sýnir eingöngu staðsetningu tveggja mælinga.'],c:1,ok:'Tímalínurit sýnir gildi breytu á mismunandi tímum og gerir þróun hennar sýnilega.',h:['Leitaðu að því sem bókin segir að tímalínurit sýni með tilliti til tíma.','Hugsaðu um röð mælinga frá fyrr til síðar.','Veldu línuritið sem sýnir hegðun eða þróun breytu yfir tíma.']},
          {id:'a9',tag:'Tímalínurit',q:'Hvernig eru ásar tímalínurits notaðir?',o:['Tími er á lárétta ásnum og gildi breytunnar á lóðrétta ásnum.','Tími er á lóðrétta ásnum og gildi breytunnar á lárétta ásnum.','Báðir ásar sýna prósentur og tíminn kemur fram í skýringum.','Lárétti ásinn sýnir flokka en lóðrétti ásinn hefur enga talnakvarða.'],c:0,ok:'Tíminn er settur á lárétta ásinn og mæligildi breytunnar á lóðrétta ásinn.',h:['Skoðaðu hvar árin eru staðsett í dæminu í bókinni.','Tíminn færist frá vinstri til hægri.','Veldu svarið þar sem tími er á x-ás og mæligildi á y-ás.']},
          {id:'a10',tag:'Tímalínurit',q:'Hvernig er tímalínurit búið til úr töflu með tíma og mæligildum?',o:['Tímanum er raðað á lárétta ásinn, hvert mæligildi merkt við réttan tíma og punktarnir tengdir í tímaröð.','Hverju mæligildi er breytt í gráður og geiri teiknaður fyrir hvert tímabil.','Tíðni hvers mæligildis er talin og samliggjandi stöplar teiknaðir.','Aðeins fyrsta og síðasta mælingin eru merkt og bein lína dregin á milli þeirra.'],c:0,ok:'Í tímalínuriti er hvert tímagildi parað við mæligildi, punktarnir merktir og tengdir í tímaröð.',h:['Berðu töfluna á bls. 41 saman við línuritið fyrir neðan hana.','Hvert ár í töflunni á einn samsvarandi punkt í myndritinu.','Settu tímann á x-ás, gildið á y-ás og tengdu punktana frá fyrri tíma til síðari.']},
          {id:'a11',tag:'Tímalínurit',q:'Hvernig lesum við þróun úr tímalínuriti?',o:['Með því að skoða hvernig línan hækkar, lækkar eða helst stöðug þegar tíminn líður.','Með því að leggja saman öll mæligildi þar til summan verður 100%.','Með því að bera saman flatarmál geira í hring.','Með því að athuga hvort súlurnar snertast.'],c:0,ok:'Stefna línunnar milli tímapunkta sýnir hvort breytan hækkar, lækkar eða stendur í stað yfir tíma.',h:['Fylgdu línunni frá vinstri til hægri.','Berðu saman hæð punkta á fyrri og síðari tímum.','Hækkandi, lækkandi eða lárétt lína lýsir þróun breytunnar.']}

        skills:['Ég get breytt prósentutölum í gráðuhorn og teiknað nákvæm skífurit með hringfara og gráðuboga.','Ég get hannað og teiknað tímalínurit þar sem tími er á lárétta ásnum og greint þróun eða leiti breytna yfir tíma.','Ég get borið saman hlutfallsskiptingu ólíkra hópa með því að bera saman skífurit þeirra hlið við hlið.'],
        challenge:['<article class="card custom-task"><div class="card-top"><span class="card-tag">Kafli 2.5 · Skífurit</span></div><h3>Hlutfall eða fjöldi?</h3><p>Í tveimur skólum var kannað hversu margir nemendur taka strætó í skólann:</p><ul class="compact-list"><li><strong>Skóli A:</strong> 100 nemendur, 60% taka strætó.</li><li><strong>Skóli B:</strong> 600 nemendur, 20% taka strætó.</li></ul><p><strong>Verkefni:</strong></p><ol class="compact-list"><li>Í hvorum skólanum er <strong>hlutfall</strong> strætófarþega hærra?</li><li>Reiknaðu <strong>fjölda</strong> strætófarþega í hvorum skóla.</li><li>Í hvorum skólanum eru fleiri strætófarþegar?</li><li>Útskýrðu hvers vegna það getur verið villandi að bera aðeins saman skífurit skólanna ef heildarfjöldi nemenda kemur ekki fram.</li></ol></article>','<article class="card custom-task"><div class="card-top"><span class="card-tag">Kafli 2.6 · Tímalínurit</span></div><h3>Sömu gögn – ólík ásýnd</h3><table class="a-table"><thead><tr><th scope="col">Mánuður</th><th scope="col">Jan.</th><th scope="col">Feb.</th><th scope="col">Mars</th><th scope="col">Apríl</th><th scope="col">Maí</th><th scope="col">Júní</th></tr></thead><tbody><tr><th scope="row">Tekjur (m.kr.)</th><td>20,0</td><td>20,5</td><td>20,2</td><td>21,0</td><td>20,8</td><td>21,5</td></tr></tbody></table><p><strong>Verkefni:</strong></p><ol class="compact-list"><li>Teiknaðu tímalínurit þar sem y-ásinn nær frá <strong>0 til 25 m.kr.</strong></li><li>Teiknaðu sömu gögn aftur, en láttu y-ásinn ná frá <strong>19,5 til 22 m.kr.</strong></li><li>Berðu myndritin saman. Hvernig breytist ásýnd þróunarinnar þótt gögnin séu nákvæmlega þau sömu?</li><li>Hvort myndritið gæti gefið sterkari tilfinningu fyrir miklum vexti? <strong>Rökstyddu svarið með vísun í kvarða y-ássins.</strong></li></ol></article>']},
      friday:{label:'Föstudagur',chapters:'Kafli 2.7 · Aðvörun',title:'Gagnrýninn lestur myndrita',intro:'Lestu myndrit af varkárni og greindu hvernig framsetning getur brenglað túlkun gagna.',aKicker:'A · Leiðsagnarlestur',aTitle:'Athugaðu skilninginn',aIntro:'Lestu viðeigandi blaðsíðu í kennslubókinni með spurninguna í huga og veldu síðan rétt svar. Spurning telst lokið þegar rétt svar fæst.',
        a:[
          {id:'a4',tag:'Gagnrýninn lestur',q:'Hvers vegna þurfum við að sýna sérstaka varkárni þegar við túlkum myndrit?',o:['Tölurnar á ásunum verða ónákvæmari þegar þær eru settar á myndrit.','Auðvelt er að hanna myndrit þannig að þau gefi brenglaða mynd eða valdi misskilningi.','Myndrit geta aðeins sýnt meðaltöl en ekki hlutföll.','Myndrit eru aðeins áreiðanleg ef þau sýna fleiri en eina breytu.'],c:1,ok:'Myndir eru áhrifamiklar og framsetning þeirra getur haft mikil áhrif á hvernig við túlkum gögnin.',h:['Skoðaðu viðvörunina í upphafi kaflans.','Hugsaðu um áhrif þess hvernig ásar, stærðir og skýringar eru hönnuð.','Veldu svarið sem segir að framsetning geti brenglað mynd eða valdið misskilningi.']},
          {id:'a5',tag:'Skýr framsetning',q:'Hvað er mikilvægt svo myndrit gefi skýrar og áreiðanlegar upplýsingar?',o:['Að nota sem flesta liti og myndtákn.','Að kvarðar séu vel merktir og skýringar stuttar og hnitmiðaðar.','Að hafa alltaf þrjár eða fleiri breytur á sama myndriti.','Að láta alla ása byrja í hæsta mæligildinu.'],c:1,ok:'Skýr merking kvarða og hnitmiðaðar skýringar hjálpa lesandanum að túlka myndritið rétt.',h:['Leitaðu að því sem bókin segir um kvarða og skýringar.','Markmiðið er að draga úr hættu á misskilningi.','Veldu svarið með vel merktum kvörðum og hnitmiðuðum skýringum.']},
          {id:'a6',tag:'Hlutföll ása',q:'Hvernig má láta hækkun á línuriti virðast minni en hún annars myndi gera?',o:['Lengja lóðrétta ásinn en stytta tímaásinn.','Stytta lóðrétta ásinn en lengja tímaásinn.','Fjarlægja allar tölur af ásunum.','Breyta línuritinu í skífurit.'],c:1,ok:'Með því að stytta ásinn sem sýnir gildin og lengja tímaásinn verður línan flatari og hækkunin virðist minni. Ef lóðrétti ásinn er lengdur og tímaásinn styttur virðist sama hækkun meiri.',h:['Berðu saman lóðrétta ásinn og tímaásinn á bls. 44.','Til að fletja línuna þarf minna lóðrétt rými og meira lárétt rými.','Veldu styttri lóðréttan ás og lengri tímaás.']},
          {id:'a7',tag:'Afskorinn ás',q:'Hvers vegna getur verið mjög villandi að láta lóðrétta ásinn í súluriti byrja hærra en í 0?',o:['Flokkarnir færast úr stað á lárétta ásnum.','Súlurnar hætta að sýna töluleg gögn.','Munurinn á hæð súlnanna getur virst miklu meiri en hann er í raun.','Þá má aðeins sýna prósentur en ekki tíðni.'],c:2,ok:'Þegar neðan er skorið af súlunum brenglast sjónrænn samanburður á hæð þeirra og lítill munur getur virst mjög stór.',h:['Skoðaðu hvað gerist þegar neðsti hluti súlnanna hverfur.','Berðu saman sýnilega hæð súlnanna við raunveruleg gildi þeirra.','Afskorinn ás getur ýkt sjónrænan mun á súlunum.']},
          {id:'a9',tag:'Afskorinn ás',q:'Í dæminu um verð á landbúnaðarvörum byrjar lóðrétti ásinn í 60% í stað 0%. Hvers vegna gefur það villandi mynd af muninum á 89% og 69,5%?',o:['Vegna þess að raunverulegi munurinn er 19,5 prósentustig en afskorinn ás lætur sjónræna muninn virðast miklu meiri.','Vegna þess að prósenturnar verða alltaf að leggja saman í 100%.','Vegna þess að ekki má nota prósentur í súluritum.','Vegna þess að aðeins má bera saman jafnstóra hópa í súluriti.'],c:0,ok:'Afskorinn ás stækkar sjónrænan mun á súlunum án þess að tölurnar sjálfar hafi breyst.',h:['Reiknaðu fyrst muninn á 89% og 69,5%.','Skoðaðu hvaða hluti súlnanna er ekki sýndur þegar ásinn byrjar í 60%.','Afskorinn ás ýkir sjónrænt raunverulegan mun sem er 19,5 prósentustig.']}
        ],

          {id:'b8',tag:'Hagnýtt verkefni',title:'Blekktu með sönnum tölum!',paper:'Vinndu verkefnið á blað.',custom:'<p>Nú átt þú að nota það sem þú hefur lært um villandi myndrit. Þú munt sýna nákvæmlega sömu gögn á tvo mismunandi vegu.</p><h3>Gefið</h3><p>Notaðu eftirfarandi gögn um sölu fyrirtækis:</p><table class="a-table"><thead><tr><th scope="col">Mánuður</th><th scope="col">Janúar</th><th scope="col">Febrúar</th><th scope="col">Mars</th><th scope="col">Apríl</th><th scope="col">Maí</th><th scope="col">Júní</th></tr></thead><tbody><tr><th scope="row">Sala</th><td>40</td><td>42</td><td>41</td><td>44</td><td>43</td><td>46</td></tr></tbody></table><h3>Verkefni</h3><ol class="compact-list"><li><strong>Hlutlaus framsetning</strong><br>Teiknaðu línurit sem sýnir gögnin eins skýrt og sanngjarnt og þú getur. Merktu ása og veldu kvarða sem gefur skýra mynd af gögnunum.</li><li><strong>Misleiðandi framsetning</strong><br>Teiknaðu annað línurit með <strong>NÁKVÆMLEGA</strong> sömu tölum en breyttu framsetningunni þannig að þróunin virðist annaðhvort:<ul><li>mjög mikil og dramatísk, eða</li><li>mjög lítil og nánast engin.</li></ul>Þú mátt ekki breyta tölunum sjálfum.</li><li><strong>Afhjúpaðu blekkinguna</strong><br>Svaraðu stuttlega á blað:<ul><li>Hvaða skilaboð vildir þú að seinna myndritið gæfi?</li><li>Hverju breyttir þú í framsetningunni?</li><li>Hvers vegna hefur breytingin áhrif á hvernig lesandinn túlkar gögnin?</li></ul></li></ol>'}

        skills:['Ég get greint hvernig kvarðar og hlutföll ása geta breytt ásýnd myndrits.','Ég get útskýrt hvers vegna afskorinn ás getur gert súlurit villandi.','Ég get greint þegar stærð myndtákna ýkir raunverulegan mun í gögnum.','Ég get lesið myndrit gagnrýnið og rökstutt hvort framsetning þess gefi sanngjarna mynd af gögnunum.'],

    const state=Object.fromEntries(Object.keys(days).map(id=>[id,loadDay(id)]));
    function thursdayHTML(id,d){const quiz=i=>{const q=d.a[i];return `<article class="card quiz-card" data-day="${id}" data-q="${q.id||`a${i+1}`}"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${q.tag}</span></div>${q.visual?`<div class="a-visual">${q.visual}</div>`:''}<h3>${q.q}</h3><div class="book-reference">Skoðaðu bls. ${PAGE_REFS[id].a[i]} í kennslubók</div><div class="options">${q.o.map((o,j)=>`<button class="option" data-index="${j}">${o}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><p class="attempt-count" hidden></p></article>`},book=(i,n)=>{const b=d.b[i];return `<article class="card ${b.custom?'custom-task':'book-task'}"><div class="card-top"><span class="number">${n}</span><span class="card-tag">${b.tag}</span></div><h3>${b.title}</h3>${b.ref?`<div class="book-reference">${b.ref}</div>`:''}<div class="book-reference">Skoðaðu bls. ${PAGE_REFS[id].b[i]} í kennslubók</div><p class="paper-note">${b.paper}</p>${b.custom?`<div class="custom-data">${b.custom}</div>`:''}<label class="task-check"><input type="checkbox" data-day="${id}" data-b="${b.id||`b${i+1}`}"><span>Ég hef lokið verkefninu og varðveiti vinnuna.</span></label></article>`},aSection=(title,indices)=>`<section><p class="section-kicker">${d.aKicker}</p><h2>${title} · ${d.aTitle}</h2><p class="section-intro">${d.aIntro}</p>${indices.map(quiz).join('')}</section>`,bSection=(title,indices,completion='')=>`<section><p class="section-kicker">B · ${title}</p><h2>Sjálfstæð dæmavinna</h2><p class="section-intro">Vinndu dæmin á blaði og merktu við þegar þeim er lokið.</p>${indices.map((i,n)=>book(i,n+1)).join('')}${completion}</section>`;return `<div class="panel" id="panel-${id}"><section><p class="section-kicker">${d.label} · ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section>${aSection('Skífurit',[0,1,2,3])}${bSection('Skífurit',[2,3])}${aSection('Tímalínurit',[4,5,6,7])}${bSection('Tímalínurit',[0,1],`<div class="completion" id="complete-${id}">Kjarnavinnu dagsins er lokið.</div>`)}<section><p class="section-kicker">Ígrundun</p><h2>Sjálfsmat</h2><div class="card"><p><strong>Hugsaðu um þessi hæfniviðmið:</strong></p><ul class="skills">${d.skills.map(s=>`<li>${s}</li>`).join('')}</ul><p><strong>Hvernig stendur þú eftir vinnu dagsins?</strong></p><div class="self-options">${[['green','🟢 Ég get þetta sjálfstætt'],['yellow','🟡 Ég þarf meiri æfingu'],['red','🔴 Ég þarf aðstoð']].map(x=>`<button class="self-button" data-day="${id}" data-self="${x[0]}">${x[1]}</button>`).join('')}</div><p class="self-note" id="self-${id}"></p></div></section><section><p class="section-kicker">Valfrjálst</p><h2>Viltu meiri áskorun?</h2><details><summary>Meiri áskorun</summary><div class="details-body">${d.challenge.join('')}</div></details></section></div>`}
    function dayHTML(id,d){return `<div class="panel" id="panel-${id}"><section><p class="section-kicker">${d.label} · ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">${d.aKicker||'A · Grunnskilningur'}</p><h2>${d.aTitle||'Athugaðu skilninginn'}</h2><p class="section-intro">${d.aIntro||'Svaraðu án blaðs eða reiknivélar. Dæmi telst lokið þegar rétt svar fæst.'}</p>${d.a.map((q,i)=>`<article class="card quiz-card" data-day="${id}" data-q="${q.id||`a${i+1}`}"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${q.tag}</span></div>${q.visual?`<div class="a-visual">${q.visual}</div>`:''}<h3>${q.q}</h3><div class="book-reference">Skoðaðu bls. ${PAGE_REFS[id].a[i]} í kennslubók</div><div class="options">${q.o.map((o,j)=>`<button class="option" data-index="${j}">${o}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><p class="attempt-count" hidden></p></article>`).join('')}</section><section><p class="section-kicker">B · Reikningur og beiting</p><h2>Sjálfstæð dæmavinna</h2><p class="section-intro">Vinndu dæmin á blaði og merktu við þegar þeim er lokið.</p>${d.b.map((b,i)=>`<article class="card ${b.custom?'custom-task':'book-task'}"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${b.tag}</span></div><h3>${b.title}</h3>${b.ref?`<div class="book-reference">${b.ref}</div>`:''}<div class="book-reference">Skoðaðu bls. ${PAGE_REFS[id].b[i]} í kennslubók</div><p class="paper-note">${b.paper}</p>${b.custom?`<div class="custom-data">${b.custom}</div>`:''}<label class="task-check"><input type="checkbox" data-day="${id}" data-b="${b.id||`b${i+1}`}"><span>Ég hef lokið verkefninu og varðveiti vinnuna.</span></label></article>`).join('')}<div class="completion" id="complete-${id}">Kjarnavinnu dagsins er lokið.</div></section><section><p class="section-kicker">Ígrundun</p><h2>Sjálfsmat</h2><div class="card"><p><strong>Hugsaðu um þessi hæfniviðmið:</strong></p><ul class="skills">${d.skills.map(s=>`<li>${s}</li>`).join('')}</ul><p><strong>Hvernig stendur þú eftir vinnu dagsins?</strong></p><div class="self-options">${[['green','🟢 Ég get þetta sjálfstætt'],['yellow','🟡 Ég þarf meiri æfingu'],['red','🔴 Ég þarf aðstoð']].map(x=>`<button class="self-button" data-day="${id}" data-self="${x[0]}">${x[1]}</button>`).join('')}</div><p class="self-note" id="self-${id}"></p></div></section><section><p class="section-kicker">Valfrjálst</p><h2>Viltu æfa meira?</h2><details><summary>Meiri æfing</summary><div class="details-body">${d.practice.map(x=>`<p>${x}</p>`).join('')}</div></details><details><summary>Meiri áskorun</summary><div class="details-body">${d.challenge.map(x=>`<p>${x}</p>`).join('')}</div></details></section></div>`}

    function mondayHTML(){return `<div class="panel" id="panel-monday"><section><p class="section-kicker">Mánudagur · Könnun 1</p><h2>Könnun 1</h2><p class="section-intro">Opnaðu könnunina, vinndu hana og skoðaðu lausnina að því loknu. Könnunin hefur ekki áhrif á framvindu vinnubókarinnar.</p><div class="card"><div class="card-top"><span class="number">1</span><span class="card-tag">Könnun</span></div><h3>Þreyta Könnun 1</h3><p>Opnaðu PDF-skrána og leystu könnunina áður en þú skoðar lausnina.</p><button class="primary" id="quizPdfButton">Þreyta Könnun 1</button></div><div class="card"><div class="card-top"><span class="number">2</span><span class="card-tag">Lausn</span></div><h3>Skoða lausn Könnunar 1</h3><p>Skoðaðu lausnina eftir að þú hefur lokið könnuninni.</p><button class="secondary" id="quizSolutionPdfButton">Skoða lausn Könnunar 1</button></div></section></div>`}
    function weeklyHTML(){return `<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 2 · Skjáskot</p><h2>Vikuskil</h2><p class="section-intro">Taktu eitt skjáskot af yfirlitinu þegar vinnu vikunnar er lokið.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 2</h3><div class="week-grid" id="weekGrid"></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="daysDone">0 af 4</strong>Loknir dagar</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar A-tilraunir</div></div><p><strong>Fjöldi rangra tilrauna hefur ekki áhrif á stig eða framvindu.</strong></p></div><div class="card submission"><h3>Skilaðu eftirfarandi:</h3><ul><li>ljósmyndum eða skönnun af <strong>reiknuðum dæmum úr B-hluta</strong> vinnubókarinnar;</li><li><strong>skjáskoti af framvinduyfirlitinu hér að ofan</strong>.</li></ul><p>Gættu þess að reikningar, teikningar og svör séu skýr og læsileg.</p><h3>Mat</h3><p>Vikuskilin eiga að sýna reglulega vinnu yfir vikuna. Fullt hús stiga fæst ef kjarnavinnu allra daga er lokið og öllum B-dæmum er skilað með sýnilegum útreikningum, teikningum eða annarri vinnu þar sem við á.</p><p><strong>Fjöldi rangra tilrauna hefur ekki áhrif á stig eða framvindu.</strong></p><button class="primary" id="submissionButton">Opna skilahólf</button></div></section></div>`}

    document.getElementById('tabs').innerHTML=tabs.map(([id,l])=>`<button class="tab" data-tab="${id}"${id==='monday'?' disabled aria-disabled="true"':''}>${l}</button>`).join('');
    document.getElementById('main').innerHTML=mondayHTML()+Object.entries(days).map(([id,d])=>id==='thursday'?thursdayHTML(id,d):dayHTML(id,d)).join('')+weeklyHTML();
    const thursdayPanel=document.getElementById('panel-thursday'),thursdayCompletion=document.getElementById('complete-thursday'),thursdayChallengeDetails=[...thursdayPanel.querySelectorAll('details')].find(x=>x.querySelector('summary')?.textContent==='Meiri áskorun'),thursdayChallenge=thursdayChallengeDetails.closest('section'),thursdayChallengeTitle=thursdayChallenge.querySelector('h2'),thursdaySelfNote=document.getElementById('self-thursday');
    thursdayCompletion.innerHTML='<strong>Kjarnavinnu dagsins er lokið.</strong><span class="completion-note">Meiri áskorun undirbýr þig fyrir erfiðari verkefnin í áfanganum.</span>';
    thursdayChallenge.id='thursday-challenge';thursdayChallengeDetails.id='thursday-challenge-details';thursdayChallenge.querySelector('.section-kicker').remove();thursdayChallengeTitle.textContent='Næsta þrep';thursdayChallengeTitle.insertAdjacentHTML('afterend','<h3>Stefnirðu á mjög góð tök á efninu?</h3><p class="section-intro">Meiri áskorun reynir á dýpri skilning, túlkun og rökstuðning. Verkefnin undirbúa þig sérstaklega fyrir erfiðari verkefni í könnunum og prófum.</p>');thursdaySelfNote.hidden=true;

    function renderQuestion(card){const id=card.dataset.day,qid=card.dataset.q,d=days[id],q=d.a.find((x,i)=>(x.id||`a${i+1}`)===qid),s=state[id],opts=[...card.querySelectorAll('.option')],saved=s.selectedAnswers[qid],done=s.completedA.includes(qid),fb=card.querySelector('.feedback'),count=Number(s.wrongAttempts[qid])||0;opts.forEach(o=>o.classList.remove('selected','correct','incorrect'));if(Number.isInteger(saved)&&opts[saved]){opts[saved].classList.add('selected',done?'correct':'incorrect');fb.className=`feedback show ${done?'good':'bad'}`;fb.textContent=done?`Rétt. ${q.ok}`:`Ekki rétt. ${q.h[Math.min(Math.max(count,1),3)-1]} Reyndu aftur.`}else{fb.className='feedback';fb.textContent=''}const c=card.querySelector('.attempt-count');c.hidden=count===0;c.textContent=count?`Rangar tilraunir: ${count}`:''}
    document.querySelectorAll('.quiz-card').forEach(card=>{renderQuestion(card);card.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{const id=card.dataset.day,qid=card.dataset.q,s=state[id];if(s.completedA.includes(qid))return;const i=Number(btn.dataset.index),q=days[id].a.find((x,j)=>(x.id||`a${j+1}`)===qid);s.selectedAnswers[qid]=i;if(i===q.c)s.completedA.push(qid);else s.wrongAttempts[qid]=(Number(s.wrongAttempts[qid])||0)+1;saveDay(id,s);renderQuestion(card);updateAll()}))});
    document.querySelectorAll('[data-b]').forEach(x=>{const s=state[x.dataset.day];x.checked=!!s.completedB[x.dataset.b];x.addEventListener('change',()=>{s.completedB[x.dataset.b]=x.checked;saveDay(x.dataset.day,s);updateAll()})});
    document.querySelectorAll('[data-self]').forEach(btn=>{const id=btn.dataset.day,s=state[id];btn.classList.toggle('active',s.selfAssessment===btn.dataset.self);btn.addEventListener('click',()=>{s.selfAssessment=btn.dataset.self;saveDay(id,s);document.querySelectorAll(`[data-self][data-day="${id}"]`).forEach(b=>b.classList.toggle('active',b===btn));document.getElementById(`self-${id}`).textContent=selfMessages[btn.dataset.self]})});Object.keys(days).forEach(id=>{if(state[id].selfAssessment)document.getElementById(`self-${id}`).textContent=selfMessages[state[id].selfAssessment]});
    const fridayPanel=document.getElementById('panel-friday'),fridayCompletion=document.getElementById('complete-friday'),fridayChallengeDetails=[...fridayPanel.querySelectorAll('details')].find(x=>x.querySelector('summary')?.textContent==='Meiri áskorun'),fridayChallenge=fridayChallengeDetails.closest('section'),fridayChallengeTitle=fridayChallenge.querySelector('h2'),fridaySelfNote=document.getElementById('self-friday'),fridayPracticeDetails=[...fridayPanel.querySelectorAll('details')].find(x=>x.querySelector('summary')?.textContent==='Meiri æfing');
    fridayPanel.querySelector('section').insertAdjacentHTML('afterend','<section><h2>Áður en þú byrjar</h2><p>Horfðu á myndbandið og hafðu þessa spurningu í huga:</p><p><strong>Hvernig er hægt að segja mismunandi sögu með sömu gögnum?</strong></p><div class="video-embed"><iframe src="https://www.youtube.com/embed/E91bGT9BjYk" title="How to spot a misleading graph – TED-Ed / Lea Gaslowitz" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></section>');
    fridayPanel.querySelector('[data-b="b8"]').closest('.custom-task').querySelector('.book-reference').remove();
    fridayCompletion.innerHTML='<strong>Kjarnavinnu dagsins er lokið.</strong><span class="completion-note">Meiri áskorun undirbýr þig fyrir erfiðari verkefnin í áfanganum.</span>';
    fridayPracticeDetails.remove();fridayChallenge.id='friday-challenge';fridayChallengeDetails.id='friday-challenge-details';fridayChallenge.querySelector('.section-kicker').remove();fridayChallengeTitle.textContent='Næsta þrep';fridayChallengeTitle.insertAdjacentHTML('afterend','<p class="section-intro">Meiri áskorun reynir á dýpri skilning og undirbýr þig sérstaklega fyrir erfiðari verkefni áfangans.</p>');fridaySelfNote.hidden=true;

    function dayCounts(id){const activeA=new Set(days[id].a.map((q,i)=>q.id||`a${i+1}`)),activeB=new Set(days[id].b.map((b,i)=>b.id||`b${i+1}`)),a=state[id].completedA.filter(qid=>activeA.has(qid)).length,b=Object.entries(state[id].completedB).filter(([bid,done])=>done&&activeB.has(bid)).length,total=days[id].a.length+days[id].b.length,wrong=Object.entries(state[id].wrongAttempts).filter(([qid])=>activeA.has(qid)).reduce((x,[,y])=>x+(Number(y)||0),0);return{a,b,total,done:a+b===total,wrong}}
    function updateWeekly(){let done=0,total=0,daysDone=0,wrong=0;const selfLabels={green:'Sjálfstætt',yellow:'Meiri æfing',red:'Aðstoð'};let html='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">A</div><div class="week-cell week-head">B</div><div class="week-cell week-head">Kjarni</div><div class="week-cell week-head">Sjálfsmat</div><div class="week-cell week-head">Rangar</div>';Object.keys(days).forEach(id=>{const c=dayCounts(id);done+=c.a+c.b;total+=c.total;wrong+=c.wrong;if(c.done)daysDone++;html+=`<div class="week-cell"><strong>${days[id].label}</strong></div><div class="week-cell">${c.a}/${days[id].a.length}</div><div class="week-cell">${c.b}/${days[id].b.length}</div><div class="week-cell">${c.done?'✓ Lokið':'○ Ólokið'}</div><div class="week-cell">${selfLabels[state[id].selfAssessment]||'—'}</div><div class="week-cell">${c.wrong}</div>`});document.getElementById('weekGrid').innerHTML=html;document.getElementById('weekProgress').textContent=`${Math.round(done/total*100)}%`;document.getElementById('daysDone').textContent=`${daysDone} af 4`;document.getElementById('wrongTotal').textContent=wrong}
    function updateAll(){Object.keys(days).forEach(id=>document.getElementById(`complete-${id}`).classList.toggle('show',dayCounts(id).done));updateWeekly();updateTop()}
    function updateTop(){const active=document.querySelector('.tab.active')?.dataset.tab||'monday';const bar=document.getElementById('progressBar'),label=document.getElementById('progressLabel');if(days[active]){const c=dayCounts(active),n=c.a+c.b;bar.style.width=`${n/c.total*100}%`;label.textContent=`${n} af ${c.total} skylduverkefnum lokið`}else if(active==='weekly'){let n=0,t=0;Object.keys(days).forEach(id=>{const c=dayCounts(id);n+=c.a+c.b;t+=c.total});bar.style.width=`${n/t*100}%`;label.textContent=`${n} af ${t} skylduverkefnum vikunnar lokið`}else{bar.style.width='0%';label.textContent='Könnun 1 telst ekki til framvindu'}}
    function switchTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===`panel-${id}`));localStorage.setItem(TAB_KEY,id);updateAll();scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('.tab:not(:disabled)').forEach(x=>x.addEventListener('click',()=>switchTab(x.dataset.tab)));document.getElementById('submissionButton').addEventListener('click',()=>window.open(SUBMISSION_URL,'_blank','noopener'));

    function openPdf(url){if(!url){alert('PDF-hlekkurinn hefur ekki verið settur inn enn.');return}window.open(url,'_blank','noopener')}
    document.getElementById('quizPdfButton').addEventListener('click',()=>openPdf(QUIZ_PDF_URL));
    document.getElementById('quizSolutionPdfButton').addEventListener('click',()=>openPdf(QUIZ_SOLUTION_PDF_URL));
    const savedTab=localStorage.getItem(TAB_KEY);switchTab(tabs.some(([id])=>id===savedTab&&id!=='monday')?savedTab:'tuesday');
  })();
  </script>
