        skills:['Ég get breytt prósentutölum í gráðuhorn og teiknað nákvæm skífurit með hringfara og gráðuboga.','Ég get hannað og teiknað tímalínurit þar sem tími er á lárétta ásnum og greint þróun eða leiti breytna yfir tíma.','Ég get borið saman hlutfallsskiptingu ólíkra hópa með því að bera saman skífurit þeirra hlið við hlið.'],
        practice:['<strong>Tímalínurit: Æfing 2 · dæmi 7</strong><br>Æfir að teikna tímalínurit yfir langt tímabil og lýsa þróuninni.'],challenge:['<strong>Nákvæm skífuritsgerð: Æfing 2 · dæmi 9</strong><br>Æfir gráðuhorn, tugabrot og nákvæma námundun í skífuriti.']},
      friday:{label:'Föstudagur',chapters:'Kafli 2.7',title:'Gagnrýnin lestur myndrita',intro:'Greindu hvernig ásar, flatarmál og rúmmál geta brenglað sjónræna túlkun gagna.',
        a:[
          {tag:'Styttur y-ás',visual:'<svg class="a-chart" viewBox="0 0 620 330" role="img" aria-label="Súlurit þar sem flokkur A er 45 prósent, flokkur B er 50 prósent og y-ás byrjar í 40 prósentum"><g stroke="#d7d9d4" stroke-width="1"><path d="M80 260H575M80 150H575M80 40H575"/></g><g stroke="#17293b" stroke-width="2"><path d="M80 260H580"/><path d="M80 270V34"/></g><g font-size="15" text-anchor="end"><text x="68" y="265">40%</text><text x="68" y="155">45%</text><text x="68" y="45">50%</text></g><rect x="180" y="150" width="110" height="110" fill="#6aa6a1"/><rect x="390" y="40" width="110" height="220" fill="#6aa6a1"/><g font-size="17" font-weight="700" text-anchor="middle"><text x="235" y="292">A</text><text x="445" y="292">B</text><text x="235" y="140">45%</text><text x="445" y="30">50%</text></g></svg>',q:'Hvernig virkar munurinn sjónrænt í súluritinu?',o:['Hann virkar nákvæmlega réttur.','Hann virkar minni.','Hann virkar verulega ýktur.','Súlurnar hætta að vera aðskildar.'],c:2,ok:'Sýnileg hæð verður 5 á móti 10 einingum og B virðist því tvöfalt stærri.',h:['Skoðaðu aðeins sýnilega hluta súlnanna.','Reiknaðu hæðirnar yfir 40% ásmörkunum í huganum.','Berðu saman 45−40 og 50−40. Hvernig lítur hlutfallið 5 á móti 10 út?']},
          {tag:'Þrívíð brenglun',visual:'<svg class="a-chart" viewBox="0 0 620 330" role="img" aria-label="Tveir þrívíðir kassar; sala tvöfaldast en lengd, breidd og hæð stærri kassans eru tvöfaldaðar"><g fill="#dcecea" stroke="#176b69" stroke-width="2"><path d="M95 190l42-28 90 0-42 28z"/><path d="M185 190l42-28v78l-42 28z"/><path d="M95 190h90v78H95z"/><path d="M320 120l84-56h180l-84 56z"/><path d="M500 120l84-56v156l-84 56z"/><path d="M320 120h180v156H320z"/></g><g font-size="16" font-weight="700" text-anchor="middle"><text x="160" y="303">Sala: 1×</text><text x="452" y="303">Sala: 2×</text></g><g font-size="14"><text x="101" y="184">1×</text><text x="194" y="226">1×</text><text x="136" y="284">1×</text><text x="334" y="112">2×</text><text x="522" y="198">2×</text><text x="402" y="294">2× í hverri vídd</text></g></svg>',q:'Sala tvöfaldast en allar þrjár víddir kassans eru tvöfaldaðar. Hvers vegna er myndin villandi?',o:['Kassar mega aðeins vera í stöplariti.','Flatarmálið stækkar aðeins um helming.','Rúmmálið áttfaldast og ýkir tvöföldunina.','Framsetningin er rétt.'],c:2,ok:'Tvöföldun þriggja vídda gefur 2³ = 8-falt rúmmál.',h:['Hugsaðu um fleiri en eina vídd.','Margfalda þarf stækkun lengdar, breiddar og dýptar.','Reiknaðu 2 × 2 × 2 og berðu við raunverulega tvöföldun.']},
          {tag:'Teygður x-ás',q:'Hvað gerist sjónrænt ef x-ás línurits er lengdur mikið en y-ás helst óbreyttur?',o:['Línan verður brattari.','Línan verður flatari og breytingin virkar hægari.','Punktarnir fá röng gildi.','Það hefur engin áhrif.'],c:1,ok:'Meira lárétt bil minnkar sjónrænan halla línunnar.',h:['Hugsaðu um halla sem hækkun deilt með láréttri vegalengd.','y-breytingin helst sú sama en lárétta vegalengdin stækkar.','Þegar nefnari hallans stækkar verður hallinn minni. Hvernig lítur línan þá út?']}
        ],
        b:[
          {tag:'Ásamörk',title:'Brengluð ásamörk í súluriti',ref:'Æfing 2 · dæmi 13',paper:'Reiknaðu og rökstuddu á blað.'},
          {tag:'Línurit',title:'Val á ásmörkum í línuriti',ref:'Æfing 2 · dæmi 15',paper:'Greindu og rökstuddu á blað.'},
          {tag:'Rúmmál',title:'Teikning með rúmmálshlutum',ref:'Æfing 2 · dæmi 11',paper:'Reiknaðu og rökstuddu á blað.'}
        ],
        skills:['Ég get útskýrt stærðfræðilega og myndrænt hvers vegna stytting lóðrétta áss ýkir raunverulegan mun á milli súlna.','Ég get greint hvernig teygja eða stytting á ásum línurits breytir sjónrænum bratta og túlkun.','Ég get sýnt með rúmmálsreikningi hvers vegna þrívíðir hlutir geta ýkt gögn.'],
        practice:['<strong>Gagnrýnin myndrýni: Æfing 2 · dæmi 14</strong><br>Æfir að greina villandi ásmörk og þrívíða framsetningu í myndriti.'],challenge:['<strong>Flatarmálsblekking: Æfing 2 · dæmi 10</strong><br>Æfir að reikna hvernig stækkun radíuss ýkir flatarmál hrings.','<strong>Rúmmálsblekking: Æfing 2 · dæmi 12</strong><br>Æfir að meta og reikna brenglun þegar sívalningur stækkar í fleiri en einni vídd.']}
    };

    function emptyDay(){return{completedA:[],wrongAttempts:{},selectedAnswers:{},completedB:{},selfAssessment:null}}
    function loadDay(id){try{const x=JSON.parse(localStorage.getItem(DAY_KEYS[id]));const s=x&&typeof x==='object'?{...emptyDay(),...x}:emptyDay(),validA=new Set(days[id].a.map((_,i)=>`a${i+1}`)),validB=new Set(days[id].b.map((_,i)=>`b${i+1}`));s.completedA=[...new Set((Array.isArray(s.completedA)?s.completedA:[]).filter(k=>validA.has(k)))];s.wrongAttempts=Object.fromEntries(Object.entries(s.wrongAttempts||{}).filter(([k])=>validA.has(k)));s.selectedAnswers=Object.fromEntries(Object.entries(s.selectedAnswers||{}).filter(([k])=>validA.has(k)));s.completedB=Object.fromEntries(Object.entries(s.completedB||{}).filter(([k])=>validB.has(k)));return s}catch{return emptyDay()}}
    function saveDay(id,s){localStorage.setItem(DAY_KEYS[id],JSON.stringify(s))}
    const state=Object.fromEntries(Object.keys(days).map(id=>[id,loadDay(id)]));
    function dayHTML(id,d){return `<div class="panel" id="panel-${id}"><section><p class="section-kicker">${d.label} · ${d.chapters}</p><h2>${d.title}</h2><p class="section-intro">${d.intro}</p></section><section><p class="section-kicker">A · Grunnskilningur</p><h2>Athugaðu skilninginn</h2><p class="section-intro">Svaraðu án blaðs eða reiknivélar. Dæmi telst lokið þegar rétt svar fæst.</p>${d.a.map((q,i)=>`<article class="card quiz-card" data-day="${id}" data-q="a${i+1}"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${q.tag}</span></div>${q.visual?`<div class="a-visual">${q.visual}</div>`:''}<h3>${q.q}</h3><div class="options">${q.o.map((o,j)=>`<button class="option" data-index="${j}">${o}</button>`).join('')}</div><div class="feedback" role="status" aria-live="polite"></div><p class="attempt-count" hidden></p></article>`).join('')}</section><section><p class="section-kicker">B · Reikningur og beiting</p><h2>Sjálfstæð dæmavinna</h2><p class="section-intro">Vinnaðu dæmin á blaði og merktu við þegar þeim er lokið.</p>${d.b.map((b,i)=>`<article class="card ${b.custom?'custom-task':'book-task'}"><div class="card-top"><span class="number">${i+1}</span><span class="card-tag">${b.tag}</span></div><h3>${b.title}</h3>${b.ref?`<div class="book-reference">${b.ref}</div>`:''}<p class="paper-note">${b.paper}</p>${b.custom?`<div class="custom-data">${b.custom}</div>`:''}<label class="task-check"><input type="checkbox" data-day="${id}" data-b="b${i+1}"><span>Ég hef lokið verkefninu og varðveiti vinnuna.</span></label></article>`).join('')}<div class="completion" id="complete-${id}">Kjarnavinnu dagsins er lokið.</div></section><section><p class="section-kicker">Ígrundun</p><h2>Sjálfsmat</h2><div class="card"><p><strong>Hugsaðu um þessi hæfniviðmið:</strong></p><ul class="skills">${d.skills.map(s=>`<li>${s}</li>`).join('')}</ul><p><strong>Hvernig stendur þú eftir vinnu dagsins?</strong></p><div class="self-options">${[['green','🟢 Ég get þetta sjálfstætt'],['yellow','🟡 Ég þarf meiri æfingu'],['red','🔴 Ég þarf aðstoð']].map(x=>`<button class="self-button" data-day="${id}" data-self="${x[0]}">${x[1]}</button>`).join('')}</div><p class="self-note" id="self-${id}"></p></div></section><section><p class="section-kicker">Valfrjálst</p><h2>Viltu æfa meira?</h2><details><summary>Meiri æfing</summary><div class="details-body">${d.practice.map(x=>`<p>${x}</p>`).join('')}</div></details><details><summary>Meiri áskorun</summary><div class="details-body">${d.challenge.map(x=>`<p>${x}</p>`).join('')}</div></details></section></div>`}

    function weeklyHTML(){return `<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 2 · Skjáskot</p><h2>Vikuskil</h2><p class="section-intro">Taktu eitt skjáskot af yfirlitinu þegar vinnu vikunnar er lokið.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 2</h3><div class="week-grid" id="weekGrid"></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="daysDone">0 af 4</strong>Loknir dagar</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar A-tilraunir</div></div><p><strong>Fjöldi rangra tilrauna hefur ekki áhrif á stig eða framvindu.</strong></p></div><div class="card submission"><h3>Skilaðu eftirfarandi:</h3><ul><li>ljósmyndum eða skönnun af <strong>reiknuðum dæmum úr B-hluta</strong> vinnubókarinnar;</li><li><strong>skjáskoti af framvinduyfirlitinu hér að ofan</strong>.</li></ul><p>Gættu þess að reikningar, teikningar og svör séu skýr og læsileg.</p><h3>Mat</h3><p>Vikuskilin eiga að sýna reglulega vinnu yfir vikuna. Fullt hús stiga fæst ef kjarnavinnu allra daga er lokið og öllum B-dæmum er skilað með sýnilegum útreikningum, teikningum eða annarri vinnu þar sem við á.</p><p><strong>Fjöldi rangra tilrauna hefur ekki áhrif á stig eða framvindu.</strong></p><button class="primary" id="submissionButton">Opna skilahólf</button></div></section></div>`}

    document.getElementById('tabs').innerHTML=tabs.map(([id,l])=>`<button class="tab" data-tab="${id}"${id==='monday'?' disabled aria-disabled="true"':''}>${l}</button>`).join('');
    document.getElementById('main').innerHTML=Object.entries(days).map(([id,d])=>dayHTML(id,d)).join('')+weeklyHTML();

    function renderQuestion(card){const id=card.dataset.day,qid=card.dataset.q,d=days[id],q=d.a[Number(qid.slice(1))-1],s=state[id],opts=[...card.querySelectorAll('.option')],saved=s.selectedAnswers[qid],done=s.completedA.includes(qid),fb=card.querySelector('.feedback'),count=Number(s.wrongAttempts[qid])||0;opts.forEach(o=>o.classList.remove('selected','correct','incorrect'));if(Number.isInteger(saved)&&opts[saved]){opts[saved].classList.add('selected',done?'correct':'incorrect');fb.className=`feedback show ${done?'good':'bad'}`;fb.textContent=done?`Rétt. ${q.ok}`:`Ekki rétt. ${q.h[Math.min(Math.max(count,1),3)-1]} Reyndu aftur.`}else{fb.className='feedback';fb.textContent=''}const c=card.querySelector('.attempt-count');c.hidden=count===0;c.textContent=count?`Rangar tilraunir: ${count}`:''}
    document.querySelectorAll('.quiz-card').forEach(card=>{renderQuestion(card);card.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',()=>{const id=card.dataset.day,qid=card.dataset.q,s=state[id];if(s.completedA.includes(qid))return;const i=Number(btn.dataset.index),q=days[id].a[Number(qid.slice(1))-1];s.selectedAnswers[qid]=i;if(i===q.c)s.completedA.push(qid);else s.wrongAttempts[qid]=(Number(s.wrongAttempts[qid])||0)+1;saveDay(id,s);renderQuestion(card);updateAll()}))});
    document.querySelectorAll('[data-b]').forEach(x=>{const s=state[x.dataset.day];x.checked=!!s.completedB[x.dataset.b];x.addEventListener('change',()=>{s.completedB[x.dataset.b]=x.checked;saveDay(x.dataset.day,s);updateAll()})});
    document.querySelectorAll('[data-self]').forEach(btn=>{const id=btn.dataset.day,s=state[id];btn.classList.toggle('active',s.selfAssessment===btn.dataset.self);btn.addEventListener('click',()=>{s.selfAssessment=btn.dataset.self;saveDay(id,s);document.querySelectorAll(`[data-self][data-day="${id}"]`).forEach(b=>b.classList.toggle('active',b===btn));document.getElementById(`self-${id}`).textContent=selfMessages[btn.dataset.self]})});Object.keys(days).forEach(id=>{if(state[id].selfAssessment)document.getElementById(`self-${id}`).textContent=selfMessages[state[id].selfAssessment]});

    function dayCounts(id){const a=new Set(state[id].completedA).size,b=Object.values(state[id].completedB).filter(Boolean).length,total=days[id].a.length+days[id].b.length,wrong=Object.values(state[id].wrongAttempts).reduce((x,y)=>x+(Number(y)||0),0);return{a,b,total,done:a+b===total,wrong}}
    function updateWeekly(){let done=0,total=0,daysDone=0,wrong=0;let html='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">A</div><div class="week-cell week-head">B</div><div class="week-cell week-head">Kjarni</div><div class="week-cell week-head">Rangar</div>';Object.keys(days).forEach(id=>{const c=dayCounts(id);done+=c.a+c.b;total+=c.total;wrong+=c.wrong;if(c.done)daysDone++;html+=`<div class="week-cell"><strong>${days[id].label}</strong></div><div class="week-cell">${c.a}/${days[id].a.length}</div><div class="week-cell">${c.b}/${days[id].b.length}</div><div class="week-cell">${c.done?'✓ Lokið':'○ Ólokið'}</div><div class="week-cell">${c.wrong}</div>`});document.getElementById('weekGrid').innerHTML=html;document.getElementById('weekProgress').textContent=`${Math.round(done/total*100)}%`;document.getElementById('daysDone').textContent=`${daysDone} af 4`;document.getElementById('wrongTotal').textContent=wrong}
    function updateAll(){Object.keys(days).forEach(id=>document.getElementById(`complete-${id}`).classList.toggle('show',dayCounts(id).done));updateWeekly();updateTop()}
    function updateTop(){const active=document.querySelector('.tab.active')?.dataset.tab||'monday';const bar=document.getElementById('progressBar'),label=document.getElementById('progressLabel');if(days[active]){const c=dayCounts(active),n=c.a+c.b;bar.style.width=`${n/c.total*100}%`;label.textContent=`${n} af ${c.total} skylduverkefnum lokið`}else if(active==='weekly'){let n=0,t=0;Object.keys(days).forEach(id=>{const c=dayCounts(id);n+=c.a+c.b;t+=c.total});bar.style.width=`${n/t*100}%`;label.textContent=`${n} af ${t} skylduverkefnum vikunnar lokið`}else{bar.style.width='0%';label.textContent='Könnun 1 telst ekki til framvindu'}}
    function switchTab(id){if(id==='monday')return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===`panel-${id}`));localStorage.setItem(TAB_KEY,id);updateAll();scrollTo({top:0,behavior:'smooth'})}
    document.querySelectorAll('.tab:not(:disabled)').forEach(x=>x.addEventListener('click',()=>switchTab(x.dataset.tab)));document.getElementById('submissionButton').addEventListener('click',()=>window.open(SUBMISSION_URL,'_blank','noopener'));
    const savedTab=localStorage.getItem(TAB_KEY);switchTab(days[savedTab]||savedTab==='weekly'?savedTab:'tuesday');
  })();
  </script>
